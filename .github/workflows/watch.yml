name: Tradera watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a few minutes)
  push:
    branches: [main]          # redeploy the app when you change it
  workflow_dispatch: {}       # "Run workflow" button for manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tradera-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install push library
        run: pip install --quiet pywebpush

      # Listings, seen ids and the push signing key carry over between runs.
      # (The cache is private to this repo's workflows; the key never goes in the repo.)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/listings.json
            state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check Tradera
        env:
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # optional, pins the push key
        run: python bot.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: |
            docs/listings.json
            state
          key: state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
